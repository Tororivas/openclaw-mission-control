# Default values for mission-control
image:
  repository: ghcr.io/tororivas/openclaw-mission-control-backend
  tag: "latest"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8000
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  enabled: false
  className: ""
  hosts: []
  annotations: {}
  tls: []
env:
  - name: DATABASE_URL
    value: "postgresql+psycopg://postgres:postgres@mission-control-postgres:5432/mission_control"
  - name: RQ_REDIS_URL
    value: "redis://mission-control-redis:6379/0"
  - name: AUTH_MODE
    value: "local"
  - name: LOCAL_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: mission-control-secrets
        key: LOCAL_AUTH_TOKEN
  - name: BASE_URL
    value: "http://mission-control-mission-control-backend:8000"
  - name: DB_AUTO_MIGRATE
    value: "true"
