apiVersion: v1
kind: Service
metadata:
  name: {{ include "mission-control-postgres.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mission-control-postgres.name" . }}
    helm.sh/chart: {{ include "mission-control-postgres.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "mission-control-postgres.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
