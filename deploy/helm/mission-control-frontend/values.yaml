# Default values for mission-control-frontend
image:
  repository: ghcr.io/Tororivas/openclaw-mission-control-frontend
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: mission-control.local
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - secretName: mission-control-frontend-tls
  #   hosts:
  #     - mission-control.local
