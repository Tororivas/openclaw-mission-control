apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mission-control-worker
  namespace: mission-control
spec:
  interval: 5m
  releaseName: mission-control-worker
  chart:
    spec:
      chart: ./deploy/helm/mission-control-worker
      sourceRef:
        kind: GitRepository
        name: openclaw-mission-control
        namespace: flux-system
      interval: 1m
      reconcileStrategy: Revision
  values:
    replicaCount: 1
