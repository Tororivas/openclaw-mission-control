apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mission-control
  namespace: mission-control
spec:
  interval: 5m
  releaseName: mission-control
  chart:
    spec:
      # path to the chart inside the repository
      chart: ./deploy/helm/mission-control-backend
      # reference the GitRepository defined above
      sourceRef:
        kind: GitRepository
        name: openclaw-mission-control
        namespace: flux-system
      interval: 1m
      reconcileStrategy: Revision
  values:
    replicaCount: 2
    image:
      repository: ghcr.io/tororivas/openclaw-mission-control-backend
      tag: "latest"
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      annotations: {}
      hosts:
        - api.mission-control.local
      tls: []
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: mission-control-secrets
            key: DATABASE_URL
      - name: RQ_REDIS_URL
        value: "redis://mission-control-redis:6379/0"
      - name: AUTH_MODE
        value: "local"
      - name: LOCAL_AUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: mission-control-secrets
            key: LOCAL_AUTH_TOKEN
      - name: BASE_URL
        value: "http://api.mission-control.local"
      - name: DB_AUTO_MIGRATE
        value: "true"
      - name: CORS_ORIGINS
        value: "http://mission-control.local"
