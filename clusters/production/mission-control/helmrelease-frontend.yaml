apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mission-control-frontend
  namespace: mission-control
spec:
  interval: 5m
  releaseName: mission-control-frontend
  chart:
    spec:
      chart: ./deploy/helm/mission-control-frontend
      sourceRef:
        kind: GitRepository
        name: openclaw-mission-control
        namespace: flux-system
      interval: 1m
      reconcileStrategy: Revision
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/tororivas/openclaw-mission-control-frontend
      tag: "latest"
    service:
      type: ClusterIP
      port: 3000
    env:
      - name: NEXT_PUBLIC_API_URL
        value: "http://api.mission-control.local"
      - name: NEXT_PUBLIC_AUTH_MODE
        value: "local"
    ingress:
      enabled: true
      className: "nginx"
      annotations: {}
      hosts:
        - host: mission-control.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
