apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mission-control-production
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/production/mission-control
  prune: true
  sourceRef:
    kind: GitRepository
    name: openclaw-mission-control
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
